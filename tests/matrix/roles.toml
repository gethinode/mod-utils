# Config overlay for tests/matrix.mjs: exampleSite with two roles. The default role (guest) is
# not the first in Hugo's sort order (member, by weight). The cascade puts every page in both
# roles, so the getpage test page renders once per role.
defaultContentRole = 'guest'

[roles.guest]
  weight = 2
[roles.member]
  weight = 1

[[cascade]]
  [cascade.sites.matrix]
    roles = ['guest', 'member']
